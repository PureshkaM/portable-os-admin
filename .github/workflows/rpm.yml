# Сборка .rpm со встроенным рантаймом.
#
# Зачем через GitHub. Пакет несёт собственный Python с Tk и cryptography,
# собранные для x86_64, поэтому rpm отказывается собирать его на машине другой
# архитектуры: стенд проекта -- arm64, и там «compatible archs: aarch64
# noarch». Раннеры GitHub -- x86_64, то есть ровно та машина, которой не
# хватало; ничего при этом не компилируется, рантайм складывается из готовых
# пакетов дистрибутива.
#
# Рантайм тянется из сетевого репозитория РЕД ОС. Если он недоступен с
# раннера, сборка обязана упасть здесь, а не отдать пакет без рантайма: об
# этом заботится сам build-runtime.sh, который в конце запускает собранный
# интерпретатор и требует, чтобы импортировались cryptography и _tkinter.
name: rpm

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/rpm.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить инструменты сборки
        run: |
          sudo apt-get update -qq
          # rpm даёт rpmbuild и rpm2cpio, cpio нужен распаковке пакетов
          # рантайма, zstd -- метаданным репозитория РЕД ОС (они сжаты им, а
          # не gzip, как в большинстве репозиториев).
          sudo apt-get install -y -q --no-install-recommends rpm cpio zstd

      - name: Собрать рантайм
        run: sh packaging/rpm/build-runtime.sh runtime

      - name: Собрать пакет
        env:
          RUNTIME: ${{ github.workspace }}/runtime
        run: sh packaging/build-rpm.sh

      - name: Забрать пакет
        uses: actions/upload-artifact@v4
        with:
          name: portable-os-admin-rpm
          path: ~/rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error

# Проверено 13.09.2026: ручной запуск через API отвечал 500 и 502 при
# полностью исправном GitHub (страница состояния — «All Systems Operational»),
# поэтому проверяем триггер push прямым опытом.
