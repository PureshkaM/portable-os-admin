[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-os-admin"
version = "1.0.0"
description = "Secure administrative application for creating and administering a portable operating system on external media (LUKS-encrypted, with recovery and admin container)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maksim Khripunov" }]
# `cryptography` is the only third-party runtime dependency, and the floor is
# deliberately low: it is satisfied by the distribution's own python3-cryptography
# on every target (Debian, RedOS), which is what makes the package
# installable on a machine with no access to the internet. The floor is 2.6,
# not lower: AESGCM has been available since 2.0 and Scrypt since 1.6, but
# config/exchange.py signs configuration parcels exchanged between
# administrators with Ed25519, which cryptography only gained in 2.6 -- the
# floor tracks the most demanding user of the library, not the first one
# found.
dependencies = [
    "cryptography>=2.6",
]

[project.optional-dependencies]
# `pyflakes` -- не вкусовщина, а страховка от одного конкретного класса
# ошибок. 12.09.2026 полная установка упала на `name 'metadata' is not
# defined`: проверку перенесли в метод, где этой переменной нет. Тесты её не
# ловили -- путь идёт по реальному носителю, -- и обнаружилась она только на
# живом прогоне, через полчаса подготовки. pyflakes находит такое за секунду и
# без запуска кода.
dev = [
    "pytest>=7.4",
    "pyflakes>=3.0",
]

[project.scripts]
portable-os-admin = "portable_os_admin.gui.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Оба файла едут на носитель и исполняются в загрузочной среде. Перечислять
# их поимённо -- плохая идея: `ui.sh` появился 29.08.2026 и в этот список не
# попал, то есть собранный пакет отдал бы носителю модуль восстановления без
# слоя вывода, которым тот разговаривает с человеком. Обнаружилось бы это на
# живой загрузке у того, кто остался без системы.
portable_os_admin = ["recovery/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
