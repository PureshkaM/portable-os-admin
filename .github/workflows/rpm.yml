# Пакет содержит код Якоря. Python, Tk и cryptography устанавливает ОС.
name: rpm

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/rpm.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить инструменты сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q --no-install-recommends \
            rpm xvfb xauth python3-tk python3-cryptography

      - name: Собрать пакет
        run: sh packaging/build-rpm.sh

      - name: Открыть стартовое окно из собранного RPM
        run: |
          set -o pipefail
          set -- "$HOME"/rpmbuild/RPMS/noarch/portable-os-admin-[0-9]*.rpm
          test "$#" -eq 1
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          rpm2archive - < "$1" | tar -xz -C "$root"
          xvfb-run -a /usr/bin/python3 -I - "$root/usr/lib/portable-os-admin/app" <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          from portable_os_admin.gui.app import PortableOSAdminGUI

          window = PortableOSAdminGUI()
          window.update()
          assert window.winfo_viewable()
          print(window.title())
          window.destroy()
          PY

      - name: Забрать пакет
        uses: actions/upload-artifact@v4
        with:
          name: portable-os-admin-rpm
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

# Проверено 13.09.2026: ручной запуск через API отвечал 500 и 502 при
# полностью исправном GitHub (страница состояния — «All Systems Operational»),
# поэтому проверяем триггер push прямым опытом.
