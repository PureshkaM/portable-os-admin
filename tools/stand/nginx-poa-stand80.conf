# Стенд: порт 80, как в packaging/revocation-server/install.sh, плюс режим
# «гостиничного портала» по флагу /run/poa-stand-portal (Э14).
server {
    listen 80;
    location = /v3/probe {
        if (-f /run/poa-stand-portal) { return 302 http://10.0.2.2/portal; }
        proxy_pass http://127.0.0.1:8081;
    }
    location /v3/ {
        if (-f /run/poa-stand-portal) { return 302 http://10.0.2.2/portal; }
        proxy_pass http://127.0.0.1:8081;
    }
    location = /v2/state { proxy_pass http://127.0.0.1:8081; }
    location / { proxy_pass http://127.0.0.1:8088; }
}
