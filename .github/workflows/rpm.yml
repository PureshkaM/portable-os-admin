# Пакет содержит код Якоря. Python, GTK и cryptography устанавливает ОС.
name: rpm

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "tests/test_gui.py"
      - "tests/test_packaging.py"
      - "pyproject.toml"
      - ".github/workflows/rpm.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить инструменты сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q --no-install-recommends \
            rpm xvfb xauth gir1.2-gtk-3.0 python3-gi python3-cryptography python3-pytest

      - name: Проверить сценарии Ткача на GTK 3
        run: |
          PYTHONPATH="$PWD/src" G_DEBUG=fatal-criticals xvfb-run -a /usr/bin/python3 - <<'PY'
          import sys
          import pytest
          from portable_os_admin.gui.ui import select_gtk

          select_gtk()
          result = pytest.main(["-q", "tests/test_gui.py", "tests/test_packaging.py"])
          assert "tkinter" not in sys.modules
          raise SystemExit(result)
          PY

      - name: Собрать пакет
        run: sh packaging/build-rpm.sh

      - name: Открыть стартовое окно из собранного RPM
        run: |
          set -o pipefail
          set -- "$HOME"/rpmbuild/RPMS/noarch/portable-os-admin-[0-9]*.rpm
          test "$#" -eq 1
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          rpm2archive - < "$1" | tar -xz -C "$root"
          xvfb-run -a /usr/bin/python3 -I - "$root/usr/lib/portable-os-admin/app" <<'PY'
          import sys
          sys.path.insert(0, sys.argv[1])
          from portable_os_admin.gui.ui import select_gtk

          select_gtk()
          from portable_os_admin.gui.app import PortableOSAdminGUI

          window = PortableOSAdminGUI()
          window.update()
          assert window.widget.get_visible()
          assert "tkinter" not in sys.modules
          print(window.widget.get_title())
          window.destroy()
          PY

      - name: Забрать пакет
        uses: actions/upload-artifact@v4
        with:
          name: portable-os-admin-rpm
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error

# Проверено 13.09.2026: ручной запуск через API отвечал 500 и 502 при
# полностью исправном GitHub (страница состояния — «All Systems Operational»),
# поэтому проверяем триггер push прямым опытом.
